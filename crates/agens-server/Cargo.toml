[package]
name = "agens-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agens-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
minijinja = { version = "2", features = ["preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }
# image inputs (src/vision.rs): data-URL decoding
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
sha2.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

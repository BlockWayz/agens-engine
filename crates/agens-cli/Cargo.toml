[package]
name = "agens-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agens"
path = "src/main.rs"

[features]
cuda = ["agens-cuda/cuda"]
m1 = ["cuda", "agens-cuda/m1", "dep:agens-server", "dep:tokio", "dep:axum"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
agens-core = { path = "../agens-core" }
agens-cuda = { path = "../agens-cuda" }
# `agens serve` (feature m1): the OpenAI front end over the engine
agens-server = { path = "../agens-server", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
